<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Asistente Rubicam</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#0b1422,#16263d);color:#fff;min-height:100vh}
    main{max-width:760px;margin:0 auto;padding:12vh 24px}
    h1{font-size:2.4rem;margin:0 0 12px} p{color:#b9c6d8;line-height:1.6}
    code{background:#0003;padding:2px 6px;border-radius:6px}
    nav{margin-top:24px;display:flex;gap:10px}
    nav button{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Página de prueba del asistente</h1>
    <p>Abre la burbuja naranja de abajo a la derecha. Si el servidor está bien configurado, responde con la información de <code>base-conocimiento.md</code>.</p>
    <p>Cambiar idioma de prueba:</p>
    <nav>
      <button onclick="location.href='?lang=es'">ES</button>
      <button onclick="location.href='?lang=en'">EN</button>
      <button onclick="location.href='?lang=de'">DE</button>
    </nav>
  </main>
  <script>
    var l = new URLSearchParams(location.search).get('lang'); if (l) document.documentElement.lang = l;
  </script>
  <script src="rubicam-chat.js" defer></script>
</body>
</html>
